[pytest]
# Pytest configuration for Suscripciones (clean-architecture-bc)

pythonpath = . src

testpaths = tests features/steps
python_files = test_*.py *_steps.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests (entities/use_cases)
    integration: Integration tests (endpoints)
    bdd: BDD tests (pytest-bdd)
    US-001: Historia de usuario US-001 (alta/baja de suscripciones)

addopts =
    -v
    --tb=short
    --strict-markers
    --cov=suscripciones.entities
    --cov=suscripciones.use_cases
    --cov-report=term-missing
    --cov-report=html

bdd_features_base_dir = features/
