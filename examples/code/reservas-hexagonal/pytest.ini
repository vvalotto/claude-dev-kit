[pytest]
# Pytest configuration for Reservas API (hexagonal-ddd-bc)

pythonpath = . src

testpaths = tests features/steps

python_files = test_*.py *_steps.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests (domain/application)
    integration: Integration tests (infrastructure/api)
    bdd: BDD tests (pytest-bdd)
    US-070: BDD tag para la historia de usuario US-070 (Reserva de un recurso)

addopts =
    -v
    --tb=short
    --strict-markers
    --cov=src/reservas
    --cov-report=term-missing
    --cov-report=html

bdd_features_base_dir = features/
