[pytest]
# Pytest configuration for FastAPI TODO API

# Add project root to Python path
pythonpath = .

testpaths = tests features
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests (service/repository)
    integration: Integration tests (endpoints)
    bdd: BDD tests (pytest-bdd)

# Coverage
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=app
    --cov-report=term-missing
    --cov-report=html

# BDD
bdd_features_base_dir = features/
