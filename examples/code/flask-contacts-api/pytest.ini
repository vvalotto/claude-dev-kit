[pytest]
# Pytest configuration for Flask Contacts API

# Test discovery
testpaths = tests features
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes

# Coverage
# Run with: pytest --cov=app --cov-report=term-missing

# BDD
bdd_features_base_dir = features/

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    bdd: BDD/Gherkin tests
    slow: Slow running tests

# Python path
pythonpath = .
