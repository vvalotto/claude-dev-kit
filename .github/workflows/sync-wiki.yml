name: Sync Documentation to Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
  workflow_dispatch:

jobs:
  sync-wiki:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone Wiki repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git wiki

      - name: Sync Documentation with PascalCase names
        run: |
          # Convierte un path docs/*.md a nombre de página wiki PascalCase
          # Ejemplo: docs/user/getting-started.md → UserGettingStarted
          build_wiki_name() {
            local filepath="$1"
            # Quitar prefijo docs/
            local rel="${filepath#docs/}"
            # Quitar extensión .md
            rel="${rel%.md}"
            # Reemplazar / y - con espacios, luego capitalizar cada palabra y concatenar
            echo "$rel" | tr '/-' ' ' | awk '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) substr($i,2); print}' | tr -d ' '
          }

          # Caso especial: docs/README.md → Home.md
          cp docs/README.md wiki/Home.md

          # Sincronizar docs/user/ — archivos directos (excluyendo index.md)
          for file in docs/user/*.md; do
            [ -f "$file" ] || continue
            [ "$(basename "$file")" = "index.md" ] && continue

            wiki_name=$(build_wiki_name "$file")
            cp "$file" "wiki/${wiki_name}.md"
          done

          # Caso especial: docs/user/index.md → UserIndex.md
          cp docs/user/index.md wiki/UserIndex.md

          # Sincronizar docs/skills/implement-us/
          for file in docs/skills/implement-us/*.md; do
            [ -f "$file" ] || continue

            wiki_name=$(build_wiki_name "$file")
            cp "$file" "wiki/${wiki_name}.md"
          done

          # Sincronizar docs/user/tracking/
          for file in docs/user/tracking/*.md; do
            [ -f "$file" ] || continue

            wiki_name=$(build_wiki_name "$file")
            cp "$file" "wiki/${wiki_name}.md"
          done

          # Sincronizar docs/developer/architecture/
          for file in docs/developer/architecture/*.md; do
            [ -f "$file" ] || continue

            wiki_name=$(build_wiki_name "$file")
            cp "$file" "wiki/${wiki_name}.md"
          done

          # Sincronizar docs/developer/contributing/ (excluir template.md — doc interno)
          for file in docs/developer/contributing/*.md; do
            [ -f "$file" ] || continue
            [ "$(basename "$file")" = "template.md" ] && continue

            wiki_name=$(build_wiki_name "$file")
            cp "$file" "wiki/${wiki_name}.md"
          done

          # Sincronizar docs/examples/
          for file in docs/examples/*.md; do
            [ -f "$file" ] || continue

            wiki_name=$(build_wiki_name "$file")
            cp "$file" "wiki/${wiki_name}.md"
          done

          echo "✅ Documentación sincronizada con nombres PascalCase"
          echo "📝 Archivos en wiki/:"
          ls wiki/*.md | wc -l
          echo "archivos .md copiados"

      - name: Commit and Push to Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd wiki
          git add .

          # Verificar si hay cambios
          if git diff --staged --quiet; then
            echo "No changes to sync"
            exit 0
          fi

          # Commit y push
          git commit -m "docs: sync documentation from main repo

          Synced from commit: ${{ github.sha }}
          Triggered by: ${{ github.event_name }}

          Structure: Flattened PascalCase (all files in root)
          - docs/README.md → Home.md
          - docs/user/getting-started.md → UserGettingStarted.md
          - docs/user/skills/implement-us.md → UserSkillsImplementUs.md
          - docs/developer/architecture/tracking.md → DeveloperArchitectureTracking.md
          - docs/examples/pyqt-project.md → ExamplesPyqtProject.md

          Files synced: $(ls *.md 2>/dev/null | wc -l) pages
          "

          git push https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git master

      - name: Summary
        if: success()
        run: |
          echo "✅ Documentation successfully synced to Wiki"
          echo "📚 Wiki URL: https://github.com/${{ github.repository }}/wiki"
